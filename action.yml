name: RN Upgrade Doctor
description: "See what breaks when you upgrade a React Native app, and what to fix first: dependencies, native config, 16 KB pages."
author: Sunkesula Chakrapani Reddy
branding:
  icon: activity
  color: blue

inputs:
  working-directory:
    description: React Native project folder, relative to the repository root.
    default: .
  apk:
    description: Path to a built APK or AAB (relative to working-directory) for the 16 KB page-size scan. Leave empty to skip.
    default: ''
  fail-on-blockers:
    description: Fail the job when the report has blockers.
    default: 'true'
  comment:
    description: "Post (or update) the Markdown report as a pull request comment. Needs `pull-requests: write` permission."
    default: 'false'
  github-token:
    description: Token used to comment on the pull request.
    default: ${{ github.token }}
  offline:
    description: "No network: use only registry data already in `cache-dir`."
    default: 'false'
  cache-dir:
    description: Registry cache folder (relative to working-directory). Combine with actions/cache to reuse data between runs. Default ~/.cache/rn-upgrade-doctor.
    default: ''

outputs:
  blockers:
    description: Number of blockers.
    value: ${{ steps.scan.outputs.blockers }}
  warnings:
    description: Number of warnings.
    value: ${{ steps.scan.outputs.warnings }}
  report-dir:
    description: Folder with rn-upgrade-doctor-report.{md,json,html}.
    value: ${{ steps.scan.outputs.report-dir }}

runs:
  using: composite
  steps:
    # GitHub-hosted runners already have Node 20+. Only install Node when it is missing or too old, so the
    # caller's own Node version is not changed for their later steps.
    - name: Check Node.js
      id: node
      shell: bash
      run: |
        major=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)
        if [ "$major" -ge 20 ]; then echo "setup=false" >> "$GITHUB_OUTPUT"; else echo "setup=true" >> "$GITHUB_OUTPUT"; fi

    - if: steps.node.outputs.setup == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build rn-upgrade-doctor
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund && npm run build

    - name: Scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APK: ${{ inputs.apk }}
        OFFLINE: ${{ inputs.offline }}
        CACHE_DIR: ${{ inputs.cache-dir }}
        OUT: ${{ runner.temp }}/rn-upgrade-doctor
      run: |
        args=(--ci --format terminal,md,json,html --out "$OUT")
        if [ -n "$APK" ]; then args+=(--apk "$APK"); fi
        if [ "$OFFLINE" = "true" ]; then args+=(--offline); fi
        if [ -n "$CACHE_DIR" ]; then args+=(--cache-dir "$CACHE_DIR"); fi
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
        code=$?
        set -e
        # 2 = the tool could not run or a registry was unreachable; 1 = blockers (handled in the last step).
        if [ "$code" -eq 2 ]; then exit 2; fi
        cat "$OUT/rn-upgrade-doctor-report.md" >> "$GITHUB_STEP_SUMMARY"
        node -e 'const r = require(process.argv[1]); console.log(`blockers=${r.summary.blockers}`); console.log(`warnings=${r.summary.warnings}`);' \
          "$OUT/rn-upgrade-doctor-report.json" >> "$GITHUB_OUTPUT"
        echo "report-dir=$OUT" >> "$GITHUB_OUTPUT"

    - name: Comment on pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPORT: ${{ steps.scan.outputs.report-dir }}/rn-upgrade-doctor-report.md
      run: |
        # Pull requests from forks get a read-only token, so commenting is not possible there.
        if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          echo "::notice::Pull request from a fork: not commenting. The report is in the job summary."
          exit 0
        fi

        # The hidden marker identifies our own comment, so it is updated in place and no other bot comment is touched.
        marker='<!-- rn-upgrade-doctor -->'
        body="$RUNNER_TEMP/rn-upgrade-doctor-comment.md"
        { echo "$marker"; head -c 60000 "$REPORT"; } > "$body"
        if [ "$(wc -c < "$REPORT")" -gt 60000 ]; then
          printf '\n\n_Report truncated; the full report is in the job summary._\n' >> "$body"
        fi

        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null \
            || echo "::warning::Could not update the pull request comment."
        else
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body" \
            || echo "::warning::Could not comment on the pull request (does the job have pull-requests: write?)."
        fi

    - name: Fail on blockers
      if: inputs.fail-on-blockers == 'true' && steps.scan.outputs.blockers != '0'
      shell: bash
      env:
        BLOCKERS: ${{ steps.scan.outputs.blockers }}
      run: |
        echo "::error::rn-upgrade-doctor found $BLOCKERS blocker(s). See the job summary."
        exit 1
